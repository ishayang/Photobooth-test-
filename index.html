<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minty Memories 🎀</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌿 ⋆˚𝜗𝜚˚⋆ 🎀</h1>
        <p>Smile for me ₍ᐢ..ᐢ₎♡ </p>
    </header>

    <main class="container">

        <section class="booth">

            <div class="decorations">
                🌷 ˖ ݁𖥔 ݁˖ 𐙚 ˖ ݁𖥔 ݁˖ 🌷
            </div>

            <div class="camera-box">
                <video id="camera" autoplay playsinline></video>
            </div>

            <div id="countdown"></div>

            <div class="controls">

                <button onclick="startCamera()">
                    📷 Start Camera
                </button>

                <button onclick="takePhotos()">
                    🎀 Take 3 Photos
                </button>

                <select id="filter">
                    <option value="none">Natural</option>
                    <option value="grayscale(1)">Soft B&W</option>
                    <option value="sepia(0.5)">Vintage</option>
                    <option value="brightness(1.2)">Bright</option>
                    <option value="contrast(1.3)">Clear</option>
                </select>

            </div>

            <canvas id="canvas"></canvas>

            <div class="result">

                <h2>⋆. 𐙚 ˚Your Photo Strip</h2>

                <img id="photoStrip">

                <br>

                <button
                    id="downloadBtn"
                    onclick="downloadPhoto()"
                    style="display:none; margin-top:15px;">
                    💚 Save My Memories
                </button>

            </div>

            <div class="tip">
                ⋆. 𐙚 ˚<strong>How to use:</strong><br><br>
                ① Start the camera<br>
                ② Choose a filter<br>
                ③ Click Take 3 Photos<br>
                ④ Pose!<br>
                ⑤ Save your photo strip
            </div>

        </section>

    </main>

    <footer>
        Made by <strong>Wang & Isha</strong><br>
        
    </footer>


    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
